# Development only. The field hub runs Postgres natively on Windows (see deploy/ in Phase 8).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emr_owner
      POSTGRES_PASSWORD: emr_dev_password
      POSTGRES_DB: emr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - emr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr_owner -d emr"]
      interval: 5s
      retries: 10

volumes:
  emr-db:
