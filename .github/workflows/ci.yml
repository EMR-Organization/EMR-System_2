name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand to get a field bundle (the "windows" job uploads it).
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: emr

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emr_owner
          POSTGRES_PASSWORD: emr_ci_password
          POSTGRES_DB: emr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emr_owner -d emr"
          --health-interval 5s
          --health-retries 10
    env:
      # The app and tests connect as the restricted role; migrations as the owner.
      DATABASE_URL: postgresql://emr_app:emr_app_ci_password@localhost:5432/emr
      DATABASE_OWNER_URL: postgresql://emr_owner:emr_ci_password@localhost:5432/emr
      BETTER_AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789
      AUDIT_KEY: ci-only-audit-key-not-for-real-use-0123456789
      BACKUP_KEY: ci-only-backup-key-not-for-real-use-0123456789
      SYNC_KEY: ci-only-sync-key-not-for-real-use-0123456789
      TRUST_PROXY: "1"
      ALLOWED_EMAIL_DOMAINS: example.org
      NODE_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emr/package-lock.json
      # Backups run pg_dump/pg_restore, which must match the server's major version (16).
      - name: PostgreSQL 16 client tools
        working-directory: .
        run: |
          sudo apt-get install -y -q postgresql-client-16 || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16)
          echo "PG_BIN_DIR=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run guards
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run db:app-role
      # Fails if schema.prisma changed without a matching migration
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run build
      # Audit what actually ships (the standalone server), not CLI tooling
      - run: npm run audit:runtime

  e2e:
    # Browser tests against the standalone server the field bundle runs, on a seeded database.
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emr_owner
          POSTGRES_PASSWORD: emr_ci_password
          POSTGRES_DB: emr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emr_owner -d emr"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://emr_app:emr_app_ci_password@localhost:5432/emr
      DATABASE_OWNER_URL: postgresql://emr_owner:emr_ci_password@localhost:5432/emr
      ALLOWED_EMAIL_DOMAINS: example.org
      NODE_ID: ci-e2e
      TRUST_PROXY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emr/package-lock.json
      # The server runs in production mode, which rightly refuses placeholder secrets.
      - name: Generate per-run secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AUDIT_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BACKUP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SYNC_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      # Backups run pg_dump/pg_restore, which must match the server's major version (16).
      - name: PostgreSQL 16 client tools
        working-directory: .
        run: |
          sudo apt-get install -y -q postgresql-client-16 || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16)
          echo "PG_BIN_DIR=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:app-role
      - run: npx prisma db seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: emr/playwright-report
          retention-days: 7

  windows:
    # Builds the Windows field bundle and runs it the way the field does: setup,
    # start-hub, then checks that only HTTPS faces the network; backup and
    # provisioning; stop; then a fallback laptop set up from the hub's
    # provisioning file, run standalone, exporting a sync bundle.
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EMR_NO_PAUSE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emr/package-lock.json
      # Node, PostgreSQL and Caddy downloads; build-bundle checks their pinned checksums every time.
      - uses: actions/cache@v4
        with:
          path: emr/deploy/.cache
          key: field-downloads-${{ hashFiles('emr/deploy/versions.json') }}
      - run: npm ci
      - name: Build the field bundle
        # No secrets at build time; the database client only needs a URL to exist (it connects on first use).
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
        run: node deploy/build-bundle.mjs --out dist/EMR
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: EMR-windows-${{ github.sha }}
          path: emr/dist/EMR
          retention-days: 30

      - name: Hub - setup
        timeout-minutes: 10
        shell: pwsh
        run: |
          robocopy dist\EMR C:\EMR /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit 1 }
          "CI Admin`nci.admin@example.org`nCorrect horse battery 2026" | Set-Content -Encoding ascii $env:RUNNER_TEMP\admin.txt
          C:\EMR\setup.bat -Role hub -EmailDomains example.org -AdminFile $env:RUNNER_TEMP\admin.txt -NoRename -NonInteractive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Get-NetFirewallRule -DisplayName 'HF EMR (HTTPS from local network)' -ErrorAction SilentlyContinue)) { throw 'no firewall rule' }
          if (-not (Get-ScheduledTask -TaskName 'HF EMR nightly backup' -ErrorAction SilentlyContinue)) { throw 'no backup task' }
          if (-not (Select-String -Path C:\EMR\config\emr.env -Pattern '^SYNC_KEY="[A-Za-z0-9_-]{40,}"$' -Quiet)) { throw 'no generated SYNC_KEY' }
          if (-not (Test-Path C:\EMR\data\caddy\ca\intermediate.key)) { throw 'no HTTPS certificate authority' }

      - name: Hub - start and check what the network can reach
        timeout-minutes: 10
        shell: pwsh
        run: |
          . C:\EMR\scripts\common.ps1
          $ErrorActionPreference = 'Stop'
          Start-Process cmd.exe -ArgumentList '/c', 'C:\EMR\start-hub.bat > C:\EMR\data\logs\start-hub.out 2>&1' -WindowStyle Hidden
          $ca = 'C:\EMR\data\caddy\ca\root.crt'
          $deadline = (Get-Date).AddMinutes(4)
          while (-not ((Test-Path $ca) -and (Test-Port '127.0.0.1' 443)) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Get-Content C:\EMR\data\logs\start-hub.out
          $ip = Get-LanIp
          $name = Get-HubName
          Write-Host "LAN address $ip, name $name"
          # --ssl-no-revoke: Windows curl (Schannel) insists on a revocation check, and an offline local CA
          # has no revocation list; browsers treat that as soft-fail.
          foreach ($url in @('https://localhost/login', "https://$ip/login")) {
            curl.exe --fail -sS --ssl-no-revoke -o NUL --cacert $ca $url
            if ($LASTEXITCODE) { throw "HTTPS failed: $url" }
          }
          curl.exe --fail -sS --ssl-no-revoke -o NUL --cacert $ca --resolve "${name}:443:127.0.0.1" "https://$name/login"
          if ($LASTEXITCODE) { throw "HTTPS failed for $name" }
          # The certificate devices install is served before sign-in and is Caddy's root.
          curl.exe --fail -sS --ssl-no-revoke -o $env:RUNNER_TEMP\served.crt --cacert $ca https://localhost/setup/certificate
          $served = New-Object Security.Cryptography.X509Certificates.X509Certificate2 "$env:RUNNER_TEMP\served.crt"
          $root = New-Object Security.Cryptography.X509Certificates.X509Certificate2 $ca
          if ($served.Thumbprint -ne $root.Thumbprint) { throw 'served certificate is not the root' }
          # Only Caddy faces the network: the app and the database answer on 127.0.0.1 only.
          if (-not (Test-Port '127.0.0.1' 3000)) { throw 'app not up locally' }
          foreach ($port in @(3000, 5433)) { if (Test-Port $ip $port) { throw "port $port is reachable on the LAN address" } }
          if (-not (Test-Port $ip 443)) { throw 'HTTPS not reachable on the LAN address' }
          # Caddy signs with the name-constrained intermediate; no root key exists on the laptop.
          if (Get-ChildItem -Recurse C:\EMR -Filter root.key -ErrorAction SilentlyContinue) { throw 'a root private key is on disk' }

          C:\EMR\backup.bat
          if ($LASTEXITCODE) { throw 'backup failed' }
          if (-not (Get-ChildItem C:\EMR\data\backups\*.hfbak)) { throw 'no backup file' }
          C:\EMR\emr-tool.bat provision-node --out C:\provision.hfprov
          if ($LASTEXITCODE -or -not (Test-Path C:\provision.hfprov)) { throw 'provision-node failed' }

          C:\EMR\stop.bat
          Start-Sleep 3
          foreach ($port in @(443, 3000, 5433)) { if (Test-Port '127.0.0.1' $port) { throw "port $port still open after stop" } }

      - name: Fallback - setup from the hub's file, run standalone, export a bundle
        timeout-minutes: 15
        shell: pwsh
        run: |
          . C:\EMR\scripts\common.ps1
          $ErrorActionPreference = 'Stop'
          robocopy dist\EMR C:\EMR-FB /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit 1 }
          C:\EMR-FB\setup.bat -Role fallback -SyncKeyFile C:\EMR\config\sync-key.txt -ProvisionFile C:\provision.hfprov -FirstNumber 5001 -EmailDomains example.org -NoSchedule -NonInteractive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Start-Process cmd.exe -ArgumentList '/c', 'C:\EMR-FB\start-standalone.bat > C:\EMR-FB\data\logs\start.out 2>&1' -WindowStyle Hidden
          $ca = 'C:\EMR-FB\data\caddy\ca\root.crt'
          $deadline = (Get-Date).AddMinutes(4)
          while (-not ((Test-Path $ca) -and (Test-Port '127.0.0.1' 443)) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Get-Content C:\EMR-FB\data\logs\start.out
          curl.exe --fail -sS --ssl-no-revoke -o NUL --cacert $ca https://localhost/login
          if ($LASTEXITCODE) { throw 'standalone HTTPS failed' }
          $ip = Get-LanIp
          if (Test-Port $ip 443) { throw 'a standalone fallback must not be reachable from the network' }
          C:\EMR-FB\emr-tool.bat export-bundle --out C:\fallback.hfsync
          if ($LASTEXITCODE -or -not (Test-Path C:\fallback.hfsync)) { throw 'export-bundle failed' }
          C:\EMR-FB\stop.bat

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-logs
          path: |
            C:/EMR/data/logs
            C:/EMR-FB/data/logs
          retention-days: 7
